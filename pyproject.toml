[project]
name = "sarm"
version = "0.1.0"
description = "Reward learning with LeRobot and PyTorch 2.7 + CUDA 12.8"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }

dependencies = [
  "torch==2.9.0",
  "torchvision==0.24.0",
  "torchaudio==2.9.0",
  "torchcodec==0.4; platform_system != 'Windows'",
  "hydra-core==1.2.0",
  "faker>=24.0.0",
  "wandb==0.13.3",
  "omegaconf==2.3.0",
  "datasets==3.6.0",
  "opencv-python==4.7.0.72",
  "moviepy==1.0.3",
  "zarr==2.18.3",
  "decord==0.6.0",


  "tqdm",
  "jsonlines",
  "draccus",
  "av",
  "numpy>=1.22.4,<2.0.0",
  "einops",
  "sentencepiece",
  "transformers",
  "ml_collections",
  "tyro",
  "datasets>=2.0.0",
  "typing-extensions",
  "filelock",
  "setuptools<81",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "pre-commit",
  "ipykernel",
  "matplotlib",
]

[tool.uv]
override-dependencies = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
torch = { index = "pytorch-cu128", marker = "platform_system == 'Windows' or platform_system == 'Linux'" }
torchvision = { index = "pytorch-cu128", marker = "platform_system == 'Windows' or platform_system == 'Linux'" }
torchaudio = { index = "pytorch-cu128", marker = "platform_system == 'Windows' or platform_system == 'Linux'" }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
  "lerobot",
  "models",
  "workspace",
  "config",
  "train.py",
  "train_utils.py",
  "data_utils.py",
]
